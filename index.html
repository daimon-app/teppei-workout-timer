<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>鉄兵 筋トレタイマー</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eef4ff}main{max-width:650px;margin:auto;padding:18px 16px 60px}h1{font-size:25px;margin:10px 0}h2{font-size:18px}button,select,input{font:inherit}button{border:0;border-radius:13px;background:#26364f;color:white;padding:13px;cursor:pointer}button.primary{background:#39a6f6;color:#061323;font-weight:800}button:disabled{opacity:.4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.panel{background:#172235;border:1px solid #304058;border-radius:18px;padding:15px;margin:13px 0}.muted{color:#a9bad1;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}.row button{flex:1}.item{padding:10px 0;border-bottom:1px solid #304058}.item:last-child{border:0}input[type=number]{width:65px;padding:8px;background:#0b1220;color:white;border:1px solid #526079;border-radius:8px}.big{font-size:64px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}#session{display:none}.active{outline:2px solid #39a6f6}.full{width:100%}small{color:#a9bad1}</style></head><body><main><h1>💪 鉄兵 筋トレタイマー</h1><p class="muted">運動時間制限なし・セット完了で休憩開始</p>
<section id="setup"><div class="panel"><h2>コース選択</h2><div class="grid"><button id="standard" onclick="choose('standard')">標準4回</button><button id="short" onclick="choose('short')">時短4分割</button><button onclick="choose('part')">部位別</button><button onclick="choose('custom')">自由選択</button></div></div>
<div class="panel"><div class="row"><button onclick="shift(-1)">← 戻る</button><strong id="dayTitle"></strong><button onclick="shift(1)">進める →</button></div><p id="subtitle" class="muted"></p><div id="items"></div><button class="primary full" onclick="start()">このメニューで開始</button></div></section>
<section id="session"><div class="panel"><div class="row"><span id="progress"></span><button onclick="exit()">終了</button></div><h2 id="exercise"></h2><p id="setInfo"></p><div id="clock" class="big">運動中</div><p id="hint" class="muted" style="text-align:center">回数を終えたらセット完了を押す</p><button class="primary full" id="done" onclick="complete()">セット完了</button><div class="row"><button onclick="back()">← 戻る</button><button onclick="skipRest()">休憩スキップ →</button></div></div></section>
</main><script>
const all=[
['胸','インクライン・ダンベルプレス',3,120],['胸','インクライン・ダンベルフライ',3,90],['胸','フラット・ダンベルプレス',3,120],['胸','フラット・ダンベルフライ',3,90],['胸','デクライン・ダンベルプレス',3,120],['胸','デクライン・ダンベルフライ',3,90],
['腕','ダンベルカール',3,60],['腕','ハンマーカール',3,60],['腕','コンセントレーションカール',3,60],['腕','ライイング・トライセプスエクステンション',3,75],['腕','トライセプスキックバック',3,60],
['肩','ショルダープレス',3,120],['肩','サイドレイズ',3,60],['肩','フロントレイズ',3,60],['肩','リアレイズ',3,60],
['背中','順手ワイド懸垂',3,120],['背中','逆手ナロー懸垂',2,120],['背中','ワンハンドダンベルロー',3,90],['背中','ベントオーバーロー',3,90],
['脚','ブルガリアンスクワット',3,90,true],['脚','ワイドスクワット',3,90],['脚','ナロースクワット',3,90],
['腹筋','ベンチ・レッグレイズ',3,60],['腹筋','アブローラー（膝コロ）',3,75],['腹筋','レッグレイズ',3,60]];
const std=[['上半身A',[0,2,15,6,12]],['下半身A',[19,20,22]],['上半身B',[1,4,16,13,9]],['下半身B',[19,21,23]]];
const short=[['胸・三頭筋',[0,1,9]],['背中・二頭筋',[15,17,6]],['脚・腹筋',[19,20,22]],['肩・腹筋',[11,12,23]]];
let lastBeepSecond=null,audioCtx=null;function beep(freq=850,duration=110){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=.10;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration/1000)}catch(e){}}function cue(sec){if(sec===lastBeepSecond)return;lastBeepSecond=sec;if(sec===10){beep(660,160);navigator.vibrate?.(100)}else if(sec===3||sec===2||sec===1){beep(850,120);navigator.vibrate?.(80)}else if(sec===0){beep(1100,430);navigator.vibrate?.([200,80,200])}}
let mode=localStorage.getItem('tt_mode')||'short',positions=JSON.parse(localStorage.getItem('tt_positions')||'{"short":0,"standard":0,"part":0,"custom":0}'),selected=[],queue=[],at=0,rest=false,endTime=0,ticker=null,history=[];
const partNames=['胸','腕','肩','背中','脚','腹筋'];
function save(){localStorage.setItem('tt_mode',mode);localStorage.setItem('tt_positions',JSON.stringify(positions))}
function choose(m){mode=m;save();render()}
function shift(d){const len=mode==='part'?6:4;positions[mode]=(positions[mode]+d+len)%len;save();render()}
function pick(){if(mode==='short'||mode==='standard'){let a=(mode==='short'?short:std)[positions[mode]];return {title:a[0],ids:a[1]}}if(mode==='part'){let name=partNames[positions.part];return {title:name,ids:all.map((x,i)=>x[0]===name?i:-1).filter(i=>i>=0)}}return {title:'好きな種目',ids:all.map((_,i)=>i)}}
function render(){document.getElementById('standard').classList.toggle('active',mode==='standard');document.getElementById('short').classList.toggle('active',mode==='short');let p=pick();document.getElementById('dayTitle').textContent=p.title;document.getElementById('subtitle').textContent=mode==='short'||mode==='standard'?'4メニューを順番に循環・完了時に次へ自動保存':mode==='part'?'部位別メニュー':'使う種目にチェック';let el=document.getElementById('items');el.innerHTML='';p.ids.forEach(i=>{let x=all[i],div=document.createElement('div');div.className='item';div.innerHTML='<label><input type="checkbox" class="check" data-i="'+i+'" '+(mode==='custom'?'':'checked')+'> '+x[1]+'</label><div class="row"><small>セット数</small><input class="sets" data-i="'+i+'" type="number" min="1" max="30" value="'+(mode==='short'?Math.min(2,x[2]):x[2])+'"><small>休憩 秒</small><input class="rests" data-i="'+i+'" type="number" min="0" max="600" value="'+x[3]+'"></div>'+(x[4]?'<small>左右それぞれ指定セット数</small>':'');el.appendChild(div)})}
function start(){queue=[...document.querySelectorAll('.check:checked')].map(e=>{let i=+e.dataset.i,x=all[i];return {name:x[1],sets:+document.querySelector('.sets[data-i="'+i+'"]').value||1,rest:+document.querySelector('.rests[data-i="'+i+'"]').value||0,split:!!x[4]}});if(!queue.length){alert('種目を選んでください');return}queue=queue.flatMap(x=>Array.from({length:x.sets*(x.split?2:1)},(_,n)=>({...x,label:x.split?(n%2===0?'左':'右')+' '+(Math.floor(n/2)+1)+'/'+x.sets:(n+1)+'/'+x.sets})));at=0;history=[];document.getElementById('setup').style.display='none';document.getElementById('session').style.display='block';show()}
function show(){clearInterval(ticker);rest=false;let x=queue[at];document.getElementById('progress').textContent=(at+1)+' / '+queue.length;document.getElementById('exercise').textContent=x.name;document.getElementById('setInfo').textContent=x.label;document.getElementById('clock').textContent='運動中';document.getElementById('hint').textContent='回数を終えたらセット完了を押す';document.getElementById('done').disabled=false;document.getElementById('done').textContent='セット完了'}
function complete(){if(rest)return;history.push(at);if(at===queue.length-1){clearInterval(ticker);if(mode==='short'||mode==='standard'){positions[mode]=(positions[mode]+1)%4;save()}alert('今日の全セット完了！');exit();return}rest=true;lastBeepSecond=null;beep(550,65);let sec=queue[at].rest;document.getElementById('done').disabled=true;document.getElementById('hint').textContent='次のセットまで休憩';endTime=Date.now()+sec*1000;tick();ticker=setInterval(tick,250)}
function tick(){let sec=Math.max(0,Math.ceil((endTime-Date.now())/1000));document.getElementById('clock').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');cue(sec);if(sec===0){clearInterval(ticker);at++;show()}}
function skipRest(){if(rest){clearInterval(ticker);at++;show()}else if(at<queue.length-1){at++;show()}}
function back(){if(rest){clearInterval(ticker);show()}else if(at>0){at--;show()}}
function exit(){clearInterval(ticker);document.getElementById('session').style.display='none';document.getElementById('setup').style.display='block';render()}
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
